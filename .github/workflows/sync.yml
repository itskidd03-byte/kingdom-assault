name: Sync source

on:
  push:
    paths: ['.github/workflows/sync.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the updated source bundle
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/code.tar.gz https://files.catbox.moe/3xbx4y.gz
          tar -xzf /tmp/code.tar.gz -C .
          grep -c "cmdAssaultAll" src/core/game.js

      - name: Commit
        run: |
          git config user.name "kingdom-assault"
          git config user.email "itskidd03@gmail.com"
          git add -A
          git commit -m "Widen the road into a 20-tile mustering ground, assault-all button, dirt-only valley"
          git push origin HEAD:main
