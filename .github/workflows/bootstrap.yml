name: Import project

on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download project bundles
        run: |
          set -euo pipefail
          mkdir -p /tmp/ka
          curl -fsSL -o /tmp/ka/code.tar.gz https://files.catbox.moe/sodj3z.gz
          curl -fsSL -o /tmp/ka/assets-1.tar.gz https://files.catbox.moe/1jkas8.gz
          curl -fsSL -o /tmp/ka/assets-2.tar.gz https://files.catbox.moe/sq437s.gz
          curl -fsSL -o /tmp/ka/assets-3.tar.gz https://files.catbox.moe/1qyepf.gz
          tar -xzf /tmp/ka/code.tar.gz -C .
          mkdir -p public/assets/models
          tar -xzf /tmp/ka/assets-1.tar.gz -C public/assets/models
          tar -xzf /tmp/ka/assets-2.tar.gz -C public/assets/models
          tar -xzf /tmp/ka/assets-3.tar.gz -C public/assets/models
          ls public/assets/models

      - name: Commit the imported sources
        continue-on-error: true
        run: |
          git config user.name "kingdom-assault"
          git config user.email "itskidd03@gmail.com"
          git add -A
          git commit -m "Import full game source and 3D art" || exit 0
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: import
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
